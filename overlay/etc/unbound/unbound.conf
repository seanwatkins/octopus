server:
    # Listen on localhost only — we don't expose DNS to the network
    interface: 127.0.0.1
    port: 53
    access-control: 127.0.0.0/8 allow

    # Root hints
    root-hints: "/etc/unbound/root.hints"

    # DNSSEC validation
    auto-trust-anchor-file: "/etc/unbound/root.key"

    # Cache
    cache-min-ttl: 300
    cache-max-ttl: 86400
    msg-cache-size: 4m
    rrset-cache-size: 8m

    # Privacy
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes

    # Logging
    verbosity: 1
    logfile: "/var/log/octopus/unbound.log"

forward-zone:
    name: "."
    forward-addr: 1.1.1.1
    forward-addr: 8.8.8.8
